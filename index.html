<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meevo SDR Call Review Scoreboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<style>
  :root{
    --ocean:#204855; --ocean2:#216479; --ocean3:#A6C1C9;
    --terra:#A75F37; --terra2:#E29D63; --terra3:#F3D8C1;
    --mauve:#4B3951; --sage:#9A997B; --sage3:#D7D6CA;
    --char:#232426; --char2:#444444; --grey:#B4B4B4;
    --ivory:#F8F7F5; --white:#FFFFFF; --good:#2F7D5B; --warn:#B5462F;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:"Source Sans 3","Source Sans Pro",Calibri,Arial,sans-serif;background:var(--ivory);color:var(--char);font-size:16px;line-height:1.45}
  header{background:linear-gradient(120deg,var(--ocean),var(--ocean2));color:#fff;padding:18px 28px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
  header h1{margin:0;font-size:22px;font-weight:800;letter-spacing:.2px}
  header .sub{opacity:.85;font-size:14px}
  .wrap{max-width:1180px;margin:0 auto;padding:24px 20px 60px}
  .card{background:#fff;border-radius:14px;box-shadow:0 1px 3px rgba(0,0,0,.06),0 6px 20px rgba(32,72,85,.06);padding:22px;margin-bottom:18px}
  h2{margin:0 0 12px;font-size:20px;color:var(--ocean)}
  h3{margin:0 0 8px;font-size:16px}
  .muted{color:var(--char2);opacity:.8}
  .small{font-size:13px}
  .row{display:flex;gap:14px;flex-wrap:wrap;align-items:center}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px}
  @media(max-width:820px){.grid2{grid-template-columns:1fr}}
  input[type=text],textarea{width:100%;padding:11px 12px;border:1.5px solid var(--sage3);border-radius:10px;font:inherit;background:#fff;color:var(--char)}
  input[type=text]:focus,textarea:focus{outline:none;border-color:var(--ocean2)}
  textarea{min-height:70px;resize:vertical}
  label{font-weight:600;font-size:14px;display:block;margin:10px 0 6px}
  button{font:inherit;font-weight:700;border:none;border-radius:10px;padding:11px 18px;cursor:pointer;transition:transform .05s,opacity .2s}
  button:active{transform:translateY(1px)}
  button:disabled{opacity:.45;cursor:not-allowed}
  .btn{background:var(--ocean);color:#fff}
  .btn.terra{background:var(--terra)}
  .btn.ghost{background:transparent;color:var(--ocean);border:1.5px solid var(--ocean3)}
  .btn.big{font-size:18px;padding:14px 24px}
  .pill{display:inline-block;padding:4px 12px;border-radius:999px;font-weight:700;font-size:13px}
  .pill.open{background:#E3F1EA;color:var(--good)}
  .pill.locked{background:var(--terra3);color:var(--terra)}
  .pill.revealed{background:var(--ocean3);color:var(--ocean)}
  .code{font-size:44px;font-weight:800;letter-spacing:8px;color:var(--ocean)}
  .bigstat{font-size:54px;font-weight:800;line-height:1}
  .banner{background:var(--terra3);color:var(--char);padding:10px 16px;border-radius:10px;margin-bottom:16px;font-size:14px}
  /* rubric scoring */
  .crit{border:1.5px solid var(--sage3);border-radius:12px;padding:16px;margin-bottom:12px;background:#fff}
  .crit.done{border-color:var(--ocean3);background:#FBFDFD}
  .crit .title{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap}
  .crit .title b{font-size:17px}
  .scale{display:flex;gap:8px;margin:12px 0 8px}
  .scale button{flex:1;background:var(--ivory);color:var(--char);border:1.5px solid var(--sage3);font-size:18px;padding:10px 0}
  .scale button.sel{background:var(--ocean);color:#fff;border-color:var(--ocean)}
  .anchor{font-size:14px;color:var(--char2);min-height:20px}
  .anchors{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;font-size:12.5px;color:var(--char2);margin-top:6px}
  .anchors div{background:var(--ivory);border-radius:8px;padding:6px 8px}
  .anchors span{font-weight:700;color:var(--ocean)}
  @media(max-width:620px){.anchors{grid-template-columns:1fr}}
  /* results */
  table{width:100%;border-collapse:collapse}
  th{text-align:left;font-size:13px;text-transform:uppercase;letter-spacing:.5px;color:var(--char2);padding:8px 6px;border-bottom:2px solid var(--sage3)}
  td{padding:10px 6px;border-bottom:1px solid #EEE;vertical-align:middle}
  .bars{min-width:220px}
  .bar{height:12px;border-radius:6px;margin:3px 0;position:relative;background:#EEF0F0}
  .bar i{display:block;height:100%;border-radius:6px}
  .bar.team i{background:var(--ocean2)}
  .bar.ai i{background:var(--terra2)}
  .flag{font-size:12px;font-weight:700;padding:3px 8px;border-radius:999px;white-space:nowrap}
  .flag.cal{background:var(--terra3);color:var(--terra)}
  .flag.split{background:#ECE6EE;color:var(--mauve)}
  .flag.ok{background:#E3F1EA;color:var(--good)}
  .legend{display:flex;gap:16px;font-size:13px;margin-bottom:6px}
  .legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
  .fb{border-radius:12px;padding:18px}
  .fb.great{background:#EEF5F2;border-left:6px solid var(--good)}
  .fb.dev{background:#FBF1EA;border-left:6px solid var(--terra)}
  .fb ol{margin:6px 0 0;padding-left:22px}
  .fb li{margin-bottom:8px}
  .score-compare{display:flex;gap:28px;flex-wrap:wrap;align-items:flex-end}
  .score-compare .lbl{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--char2)}
  .hidden{display:none!important}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--char);color:#fff;padding:10px 18px;border-radius:10px;font-size:14px;opacity:0;transition:opacity .25s;pointer-events:none}
  .toast.show{opacity:1}
  .notes li{margin-bottom:6px}
  .linkbox{display:flex;gap:8px}
  .linkbox input{font-size:13px}
  .linkbox button{white-space:nowrap}
</style>
</head>
<body>
<header>
  <div>
    <h1>SDR Call Review Scoreboard</h1>
    <div class="sub">Score blind. Reveal together. Calibrate the gaps.</div>
  </div>
  <div id="hdrStatus"></div>
</header>
<div class="wrap" id="app"></div>
<div class="toast" id="toast"></div>

<script>
/* =====================================================================
   1) PASTE YOUR FIREBASE CONFIG HERE (see setup steps).
   Until you do, the page runs in DEMO MODE (works only in this browser).
   ===================================================================== */
const FIREBASE_CONFIG = {
  apiKey: "AIzaSyB5U-6RpRVDNnrlaXYV3A2PzBHBadzCNiU",
  authDomain: "meevo-call-scoreboard.firebaseapp.com",
  databaseURL: "https://meevo-call-scoreboard-default-rtdb.firebaseio.com",
  projectId: "meevo-call-scoreboard",
  storageBucket: "meevo-call-scoreboard.firebasestorage.app",
  messagingSenderId: "956562988994",
  appId: "1:956562988994:web:091db4233f80d532f2805b"
};

/* =====================================================================
   2) RUBRIC: SDR cold call, salon / spa / med spa. Scale 1 to 5.
   Edit labels or anchors here if you want to change the rubric.
   ===================================================================== */
const RUBRIC = [
  {id:"opener", name:"Opener", q:"Did they earn the first 30 seconds?",
   a1:"Generic or apologetic opener, pitched straight away, no clear reason for the call.",
   a3:"Clear intro and reason, but scripted or a weak permission ask.",
   a5:"Confident, relevant reason tied to their business. Earned the right to ask questions."},
  {id:"tone", name:"Tone and presence", q:"Calm, confident, curious?",
   a1:"Rushed, nervous or monotone. Talks over the prospect.",
   a3:"Friendly but some filler, pace or energy issues.",
   a5:"Calm, curious, conversational. Comfortable with pauses."},
  {id:"discovery", name:"Discovery", q:"Real conversation or survey?",
   a1:"No questions, or rapid fire survey style questions.",
   a3:"Good questions but surface level. Few follow ups.",
   a5:"Open questions, followed the thread. Learned setup, locations, current system and what's not working."},
  {id:"pain", name:"Pain and impact", q:"Did they find a problem worth solving?",
   a1:"No pain uncovered.",
   a3:"Pain named but not explored or connected to the business.",
   a5:"Pain tied to impact: no-shows, rebooking, revenue, staff time, reporting, memberships or payments."},
  {id:"positioning", name:"Positioning", q:"Was the value relevant and short?",
   a1:"Feature dump or generic 'all in one' pitch.",
   a3:"Relevant value but too long or not tied to what they said.",
   a5:"Short, specific value tied to their pain (FAB), ideally with a proof point."},
  {id:"objections", name:"Objection handling", q:"Did they stay in control?",
   a1:"Folded or argued.",
   a3:"Acknowledged, then jumped straight to a rebuttal.",
   a5:"Acknowledged, asked to understand, reframed and kept the conversation moving."},
  {id:"urgency", name:"Urgency", q:"Created urgency or just reacted?",
   a1:"Reacted to the prospect. No reason to act now.",
   a3:"Hinted at the cost of waiting.",
   a5:"Clear reason to act now: contract renewal, busy season, cost of the current pain."},
  {id:"nextstep", name:"Next step and control", q:"Did they lock in the meeting?",
   a1:"No ask, or settled for 'I'll send an email'.",
   a3:"Asked for a meeting but vague on time or who attends.",
   a5:"Confident ask, specific day and time, decision maker confirmed, invite sent live."}
];

/* ===================================================================== */
const NO_SDK = typeof firebase === "undefined";
const DEMO = NO_SDK || !FIREBASE_CONFIG.apiKey || FIREBASE_CONFIG.apiKey.includes("PASTE");
const $ = s => document.querySelector(s);
const app = $("#app");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const toast = msg => { const t=$("#toast"); t.textContent=msg; t.classList.add("show"); setTimeout(()=>t.classList.remove("show"),1800); };
const newCode = () => { const c="ABCDEFGHJKMNPQRSTUVWXYZ23456789"; let s=""; for(let i=0;i<4;i++) s+=c[Math.floor(Math.random()*c.length)]; return s; };
const rid = () => Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
const ss = { get(k){try{return sessionStorage.getItem(k)}catch(e){return null}}, set(k,v){try{sessionStorage.setItem(k,v)}catch(e){}} };

/* ---------- Store: Firebase or demo (in-memory, synced across tabs) ---------- */
let store;
if(!DEMO){
  firebase.initializeApp(FIREBASE_CONFIG);
  const db = firebase.database();
  store = {
    set:(p,v)=>db.ref(p).set(v),
    update:(p,v)=>db.ref(p).update(v),
    get:async p=>(await db.ref(p).once("value")).val(),
    watch:(code,cb)=>{const r=db.ref("sessions/"+code); const h=s=>cb(s.val()); r.on("value",h); return ()=>r.off("value",h);}
  };
} else {
  let state = {}; const subs = new Set();
  let bc = null; try{ bc = new BroadcastChannel("scoreboard-demo"); }catch(e){}
  const notify = () => subs.forEach(f=>f());
  if(bc){
    bc.onmessage = e => {
      if(e.data.t==="hello") bc.postMessage({t:"state",s:state});
      if(e.data.t==="state" && JSON.stringify(e.data.s).length >= JSON.stringify(state).length){ state=e.data.s; notify(); }
      if(e.data.t==="put"){ state=e.data.s; notify(); }
    };
    bc.postMessage({t:"hello"});
  }
  const walk = (p,create) => { const k=p.split("/"); let o=state; for(let i=0;i<k.length-1;i++){ if(o[k[i]]==null){ if(!create) return [null]; o[k[i]]={}; } o=o[k[i]]; } return [o,k[k.length-1]]; };
  const commit = () => { if(bc) bc.postMessage({t:"put",s:state}); notify(); };
  store = {
    set:async(p,v)=>{ const [o,k]=walk(p,true); if(v===null) delete o[k]; else o[k]=JSON.parse(JSON.stringify(v)); commit(); },
    update:async(p,v)=>{ for(const k in v){ const [o,kk]=walk(p+"/"+k,true); o[kk]=JSON.parse(JSON.stringify(v[k])); } commit(); },
    get:async p=>{ const [o,k]=walk(p,false); return o?o[k]??null:null; },
    watch:(code,cb)=>{ const f=()=>cb(state.sessions?.[code]??null); subs.add(f); setTimeout(f,0); return ()=>subs.delete(f); }
  };
}

/* ---------- Routing ---------- */
const params = new URLSearchParams(location.search);
let unwatch = null;
function go(q){ history.pushState({}, "", location.pathname + (q?"?"+q:"")); route(); }
window.onpopstate = route;
function route(){
  if(unwatch){unwatch();unwatch=null;}
  const p = new URLSearchParams(location.search);
  if(p.get("host")) return hostView(p.get("host").toUpperCase());
  if(p.get("s")) return repView(p.get("s").toUpperCase());
  homeView();
}
const demoBanner = () => NO_SDK ? `<div class="banner"><b>Can't reach the live database.</b> Check your internet connection or network firewall, then refresh. Running in demo mode for now.</div>` : DEMO ? `<div class="banner"><b>Demo mode.</b> Scores only sync between tabs in this browser. Paste your Firebase config into the file to let reps score from their own laptops.</div>` : "";

/* ---------- Home ---------- */
function homeView(){
  $("#hdrStatus").innerHTML = "";
  app.innerHTML = `${demoBanner()}
  <div class="grid2">
    <div class="card">
      <h2>Join as a rep</h2>
      <p class="muted">Your scores are anonymous. Nobody sees individual scores, only the team average.</p>
      <label>Session code</label>
      <input type="text" id="joinCode" maxlength="4" placeholder="e.g. K7QM" style="text-transform:uppercase;font-size:22px;letter-spacing:4px">
      <div style="margin-top:14px"><button class="btn big" id="joinBtn">Join session</button></div>
    </div>
    <div class="card">
      <h2>Host a call review</h2>
      <p class="muted">Start a session, put this screen on the TV or share it on Teams.</p>
      <label>Call title</label>
      <input type="text" id="title" placeholder="e.g. Cold call, med spa, 3 locations">
      <label>Rep on the call (optional)</label>
      <input type="text" id="rep" placeholder="Leave blank to keep it anonymous">
      <div style="margin-top:14px"><button class="btn terra big" id="hostBtn">Start session</button></div>
    </div>
  </div>`;
  $("#joinBtn").onclick = () => { const c=$("#joinCode").value.trim().toUpperCase(); if(c.length===4) go("s="+c); else toast("Enter the 4 character code"); };
  $("#joinCode").onkeydown = e => { if(e.key==="Enter") $("#joinBtn").click(); };
  $("#hostBtn").onclick = async () => {
    const code = newCode();
    await store.set("sessions/"+code, { title: $("#title").value.trim() || "Call review", rep: $("#rep").value.trim(), status:"open", created: Date.now() });
    go("host="+code);
  };
}

/* ---------- Results maths ---------- */
function computeResults(s){
  const subs = Object.values(s.scores || {});
  const ai = s.claude?.scores || {};
  const rows = RUBRIC.map(c => {
    const vals = subs.map(x=>x[c.id]).filter(v=>typeof v==="number");
    const avg = vals.length ? vals.reduce((a,b)=>a+b,0)/vals.length : null;
    const min = vals.length ? Math.min(...vals) : null, max = vals.length ? Math.max(...vals) : null;
    const aiv = typeof ai[c.id]==="number" ? ai[c.id] : null;
    const gap = (avg!=null && aiv!=null) ? avg - aiv : null;
    return { ...c, avg, min, max, n: vals.length, ai: aiv, gap };
  });
  const pct = arr => { const v=arr.filter(x=>x!=null); return v.length ? Math.round(v.reduce((a,b)=>a+b,0)/v.length/5*100) : null; };
  return { rows, n: subs.length, teamPct: pct(rows.map(r=>r.avg)), aiPct: pct(rows.map(r=>r.ai)), subs };
}
function resultsHTML(s){
  const R = computeResults(s); const hasAI = !!s.claude;
  const f = v => v==null ? "–" : (Math.round(v*10)/10).toFixed(1);
  const flag = r => {
    if(r.gap!=null && Math.abs(r.gap)>=1) return `<span class="flag cal">Calibrate: team ${r.gap>0?"higher":"lower"}</span>`;
    if(r.min!=null && r.max-r.min>=3) return `<span class="flag split">Team split</span>`;
    if(r.gap!=null) return `<span class="flag ok">Aligned</span>`;
    return "";
  };
  const talk = R.rows.filter(r=>r.gap!=null && Math.abs(r.gap)>=1).sort((a,b)=>Math.abs(b.gap)-Math.abs(a.gap)).slice(0,3);
  const great = s.claude?.great || [], dev = s.claude?.develop || [];
  const notesBest = R.subs.map(x=>x.best).filter(Boolean), notesChange = R.subs.map(x=>x.change).filter(Boolean);
  return `
  <div class="card">
    <div class="score-compare">
      <div><div class="lbl">Team score (${R.n} reps)</div><div class="bigstat" style="color:var(--ocean2)">${R.teamPct??"–"}%</div></div>
      ${hasAI?`<div><div class="lbl">Claude score</div><div class="bigstat" style="color:var(--terra)">${R.aiPct??"–"}%</div></div>
      <div><div class="lbl">Gap</div><div class="bigstat" style="color:var(--char2)">${(R.teamPct!=null&&R.aiPct!=null)?((R.teamPct-R.aiPct>0?"+":"")+(R.teamPct-R.aiPct)):"–"}</div></div>`:""}
    </div>
  </div>
  <div class="card">
    <h2>Category breakdown</h2>
    <div class="legend"><span><i style="background:var(--ocean2)"></i>Team average</span>${hasAI?`<span><i style="background:var(--terra2)"></i>Claude</span>`:""}</div>
    <table>
      <tr><th>Category</th><th>Team</th><th>Range</th>${hasAI?"<th>Claude</th><th>Gap</th>":""}<th class="bars"></th><th></th></tr>
      ${R.rows.map(r=>`<tr>
        <td><b>${esc(r.name)}</b><div class="small muted">${esc(r.q)}</div></td>
        <td><b>${f(r.avg)}</b></td>
        <td class="small muted">${r.min==null?"–":r.min+" to "+r.max}</td>
        ${hasAI?`<td><b>${r.ai??"–"}</b></td><td>${r.gap==null?"–":(r.gap>0?"+":"")+f(r.gap)}</td>`:""}
        <td class="bars"><div class="bar team"><i style="width:${(r.avg||0)/5*100}%"></i></div>${hasAI?`<div class="bar ai"><i style="width:${(r.ai||0)/5*100}%"></i></div>`:""}</td>
        <td>${flag(r)}</td></tr>`).join("")}
    </table>
    ${talk.length?`<h3 style="margin-top:18px">Talk about these first</h3><ol>${talk.map(r=>`<li><b>${esc(r.name)}</b>: team ${f(r.avg)} vs Claude ${r.ai}. What did we hear differently? Point to the exact moment in the call.</li>`).join("")}</ol>`:""}
  </div>
  ${hasAI?`<div class="grid2">
    <div class="fb great"><h3>What was great</h3><ol>${great.map(g=>`<li>${esc(g)}</li>`).join("")}</ol></div>
    <div class="fb dev"><h3>Development</h3><ol>${dev.map(g=>`<li>${esc(g)}</li>`).join("")}</ol></div>
  </div>`:""}
  ${(notesBest.length||notesChange.length)?`<div class="card" style="margin-top:18px"><h2>What the team noticed (anonymous)</h2><div class="grid2">
    <div><h3>Best moment</h3><ul class="notes">${notesBest.map(n=>`<li>${esc(n)}</li>`).join("")||"<li class='muted'>None</li>"}</ul></div>
    <div><h3>One thing to change</h3><ul class="notes">${notesChange.map(n=>`<li>${esc(n)}</li>`).join("")||"<li class='muted'>None</li>"}</ul></div>
  </div></div>`:""}`;
}
const statusPill = st => `<span class="pill ${st}">${st==="open"?"Scoring open":st==="locked"?"Scoring locked":"Results revealed"}</span>`;

/* ---------- Claude score parser ---------- */
function parseClaude(txt){
  txt = txt.trim(); let obj = null;
  const m = txt.match(/\{[\s\S]*\}/);
  if(m){ try{ obj = JSON.parse(m[0]); }catch(e){} }
  if(!obj) return null;
  const scores = {}; const src = obj.scores || obj;
  RUBRIC.forEach(c=>{ const v = Number(src[c.id]); if(v>=1 && v<=5) scores[c.id]=v; });
  if(!Object.keys(scores).length) return null;
  return { scores, great:(obj.great||[]).slice(0,3), develop:(obj.develop||obj.development||[]).slice(0,3), summary: obj.summary||"" };
}

/* ---------- Host view ---------- */
function hostView(code){
  const joinURL = location.origin + location.pathname + "?s=" + code;
  app.innerHTML = `${demoBanner()}<div id="hostBody"><div class="card">Loading session ${code}...</div></div>`;
  unwatch = store.watch(code, s => {
    if(!s){ $("#hostBody").innerHTML = `<div class="card"><h2>Session not found</h2><button class="btn" onclick="go('')">Back</button></div>`; return; }
    $("#hdrStatus").innerHTML = statusPill(s.status);
    const n = Object.keys(s.scores||{}).length;
    const keepClaude = $("#claudeIn") ? $("#claudeIn").value : "";
    $("#hostBody").innerHTML = `
    <div class="card">
      <div class="row" style="justify-content:space-between;align-items:flex-start">
        <div>
          <div class="muted small">NOW REVIEWING</div>
          <h2 style="font-size:26px;margin:2px 0 4px">${esc(s.title)}</h2>
          ${s.rep?`<div class="muted">Rep: ${esc(s.rep)}</div>`:""}
        </div>
        <div style="text-align:right">
          <div class="muted small">JOIN CODE</div>
          <div class="code">${code}</div>
        </div>
      </div>
      <div class="linkbox" style="margin-top:12px"><input type="text" readonly value="${joinURL}" id="joinURL"><button class="btn ghost" id="copyBtn">Copy link</button></div>
    </div>
    <div class="grid2">
      <div class="card">
        <h2>Team scores</h2>
        <div class="row"><div class="bigstat">${n}</div><div class="muted">rep${n===1?"":"s"} submitted<br><span class="small">Scores stay hidden until you reveal</span></div></div>
        <div class="row" style="margin-top:16px">
          ${s.status==="open"?`<button class="btn terra" id="lockBtn">Lock scoring</button>`:""}
          ${s.status!=="open"?`<button class="btn ghost" id="reopenBtn">Reopen scoring</button>`:""}
          ${s.status!=="revealed"?`<button class="btn big" id="revealBtn" ${n===0?"disabled":""}>Reveal results</button>`:`<button class="btn ghost" id="hideBtn">Hide results</button>`}
        </div>
        ${DEMO?`<div style="margin-top:14px"><button class="btn ghost" id="simBtn">Add 6 sample rep scores (demo)</button></div>`:""}
      </div>
      <div class="card">
        <h2>Claude's score</h2>
        ${s.claude?`<p><span class="pill revealed">Locked in</span> <span class="muted small">Hidden until reveal, so nobody anchors on it.</span></p>
           <button class="btn ghost" id="clearClaude">Replace Claude's score</button>`
        :`<p class="muted small">Paste the score block Claude gives you after reviewing the call in Attention.</p>
          <textarea id="claudeIn" placeholder='{"scores":{"opener":4, ...},"great":[...],"develop":[...]}'>${esc(keepClaude)}</textarea>
          <div style="margin-top:10px"><button class="btn terra" id="loadClaude">Lock in Claude's score</button></div>`}
      </div>
    </div>
    <div id="results">${s.status==="revealed"?resultsHTML(s):""}</div>
    <div class="row" style="margin-top:10px"><button class="btn ghost" id="newBtn">Start a new call</button></div>`;

    $("#copyBtn").onclick = () => { navigator.clipboard?.writeText(joinURL); toast("Join link copied"); };
    const b = id => $("#"+id);
    b("lockBtn") && (b("lockBtn").onclick = () => store.update("sessions/"+code,{status:"locked"}));
    b("reopenBtn") && (b("reopenBtn").onclick = () => store.update("sessions/"+code,{status:"open"}));
    b("revealBtn") && (b("revealBtn").onclick = () => store.update("sessions/"+code,{status:"revealed"}));
    b("hideBtn") && (b("hideBtn").onclick = () => store.update("sessions/"+code,{status:"locked"}));
    b("newBtn").onclick = () => go("");
    b("clearClaude") && (b("clearClaude").onclick = () => store.set("sessions/"+code+"/claude", null));
    b("loadClaude") && (b("loadClaude").onclick = () => {
      const c = parseClaude($("#claudeIn").value);
      if(!c) return toast("Couldn't read that. Paste the full block from Claude.");
      store.set("sessions/"+code+"/claude", c); toast("Claude's score locked in");
    });
    b("simBtn") && (b("simBtn").onclick = () => {
      for(let i=0;i<6;i++){ const o={ts:Date.now()}; RUBRIC.forEach(c=>o[c.id]=Math.max(1,Math.min(5,Math.round(2.5+Math.random()*2.5)))); store.set("sessions/"+code+"/scores/"+rid(),o); }
      toast("Added 6 sample scores");
    });
  });
}

/* ---------- Rep view ---------- */
function repView(code){
  const key = "rep_"+code; let myId = ss.get(key); if(!myId){ myId=rid(); ss.set(key,myId); }
  let draft = {}; let loaded = false;
  app.innerHTML = `${demoBanner()}<div id="repBody"><div class="card">Joining ${code}...</div></div>`;
  unwatch = store.watch(code, s => {
    if(!s){ $("#repBody").innerHTML = `<div class="card"><h2>No session with code ${code}</h2><p class="muted">Check the code on the main screen.</p><button class="btn" onclick="go('')">Back</button></div>`; return; }
    $("#hdrStatus").innerHTML = statusPill(s.status);
    const mine = s.scores?.[myId];
    if(!loaded){ draft = mine ? {...mine} : {}; loaded = true; }
    if(s.status==="revealed"){ $("#repBody").innerHTML = `<div class="card"><div class="muted small">RESULTS</div><h2 style="font-size:24px">${esc(s.title)}</h2></div>${resultsHTML(s)}`; return; }
    if(s.status==="locked"){ $("#repBody").innerHTML = `<div class="card"><h2>Scoring is locked</h2><p class="muted">${mine?"Your scores are in.":"You didn't submit in time."} Eyes on the main screen for the reveal.</p></div>`; return; }
    if(document.activeElement && document.activeElement.tagName==="TEXTAREA" && $("#repForm")) return; // don't wipe typing
    renderRepForm(s, code, myId, draft, !!mine);
  });
}
function renderRepForm(s, code, myId, draft, submitted){
  const done = RUBRIC.filter(c=>draft[c.id]).length;
  $("#repBody").innerHTML = `
  <div class="card">
    <div class="muted small">SESSION ${code}</div>
    <h2 style="font-size:24px;margin:2px 0">${esc(s.title)}</h2>
    <p class="muted small" style="margin:4px 0 0">Score what you heard, not who made the call. 1 = missed it, 3 = did it but surface level, 5 = nailed it. Your scores are anonymous.</p>
  </div>
  <div id="repForm">
  ${RUBRIC.map(c=>`<div class="crit ${draft[c.id]?"done":""}">
    <div class="title"><b>${esc(c.name)}</b><span class="muted small">${esc(c.q)}</span></div>
    <div class="scale">${[1,2,3,4,5].map(v=>`<button data-c="${c.id}" data-v="${v}" class="${draft[c.id]===v?"sel":""}">${v}</button>`).join("")}</div>
    <div class="anchors"><div><span>1</span> ${esc(c.a1)}</div><div><span>3</span> ${esc(c.a3)}</div><div><span>5</span> ${esc(c.a5)}</div></div>
  </div>`).join("")}
  <div class="card">
    <label>Best moment in the call (optional)</label><textarea id="best" placeholder="What would you steal for your own calls?">${esc(draft.best||"")}</textarea>
    <label>One thing to change (optional)</label><textarea id="change" placeholder="What would you have said instead?">${esc(draft.change||"")}</textarea>
    <div class="row" style="margin-top:14px;justify-content:space-between">
      <span class="muted">${done} of ${RUBRIC.length} scored</span>
      <button class="btn big" id="submitBtn" ${done<RUBRIC.length?"disabled":""}>${submitted?"Update my scores":"Submit scores"}</button>
    </div>
    ${submitted?`<p class="small" style="color:var(--good);font-weight:700;margin:10px 0 0">Submitted. You can still change your scores until the host locks scoring.</p>`:""}
  </div></div>`;
  document.querySelectorAll(".scale button").forEach(btn => btn.onclick = () => {
    draft[btn.dataset.c] = Number(btn.dataset.v);
    draft.best = $("#best").value; draft.change = $("#change").value;
    renderRepForm(s, code, myId, draft, submitted);
  });
  $("#best").oninput = e => draft.best = e.target.value;
  $("#change").oninput = e => draft.change = e.target.value;
  $("#submitBtn").onclick = async () => {
    const o = { ts: Date.now(), best: $("#best").value.trim().slice(0,280), change: $("#change").value.trim().slice(0,280) };
    RUBRIC.forEach(c=>o[c.id]=draft[c.id]);
    await store.set("sessions/"+code+"/scores/"+myId, o);
    toast("Scores submitted");
    $("#submitBtn").blur();
    renderRepForm(s, code, myId, {...o}, true);
  };
}

route();
</script>
